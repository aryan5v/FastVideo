title: SD3.5 Medium
summary: Text-to-image generation with Stable Diffusion 3.5 Medium through the OpenAI-compatible image routes.

deployments:
  cuda-rest:
    runtime: fastvideo-cuda-rest
    workload: t2i
    defaults: examples/serving/openai_sd35.yaml
    requirements:
      - >-
        SD3.5 Medium is gated. Accept its license on Hugging Face and
        authenticate before starting the server.
    options:
      - server.*
      - generator.engine.num_gpus
      - generator.engine.offload.text_encoder
      - generator.engine.offload.vae
