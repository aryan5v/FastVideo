title: FLUX.2-klein-4B
summary: Text-to-image generation with the smaller FLUX.2-klein-4B checkpoint.

deployments:
  cuda-rest:
    runtime: fastvideo-cuda-rest
    workload: t2i
    defaults: examples/serving/openai_flux2_klein.yaml
    options:
      - server.*
      - generator.engine.num_gpus
      - generator.engine.offload.text_encoder
      - generator.engine.offload.vae
