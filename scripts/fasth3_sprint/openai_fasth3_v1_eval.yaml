# PR 1798 FastH3 server profile pinned to the released v1 VSA checkpoint.
generator:
  model_path: FastVideo/FastVideo-FastH3-4-step-Preview-v1-VSA-DataFree
  revision: b65818d41939b5085451074fe8ca8b799f8d4921
  engine:
    num_gpus: 4
    use_fsdp_inference: false
    parallelism:
      tp_size: 1
      sp_size: 4
    offload:
      dit: false
      dit_layerwise: false
      text_encoder: true
      image_encoder: true
      vae: true
      pin_cpu_memory: true
