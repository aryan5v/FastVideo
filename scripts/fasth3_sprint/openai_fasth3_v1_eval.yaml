      VSA_tile_size: 64
      inference_torch_compile: false
      vae_parallel_decode: true
      vae_parallel_decode_strategy: gather

server:
  host: 127.0.0.1
  port: 8000
  output_dir: /mnt/nfs/vlm-aryan/fasth3-h3-serve-cookbook-eval-20260831/server-artifacts
  served_model_name: fasth3-v1

default_request:
  negative_prompt: ""
  sampling:
    height: 768
    width: 1344
    num_frames: 124
    fps: 24
    num_inference_steps: 5
    guidance_scale: 1.0
    batch_cfg: false
    seed: 1000
  output:
    return_frames: false
