default_stages:
  - pre-commit # Run locally
  - manual # Run in CI
exclude: |
  (?x)(
    fastvideo/third_party/.*|
    fastvideo-kernel/.*|
    assets/.*|
    tests/.*|
    scripts/.*|
    fastvideo/dataset/.*|
    fastvideo/models/.*|
    ^apps/dreamverse/web/.*|
    examples/.*|
    \.agents/.*|
    .github/workflows/publish-fastvideo.yml|
    .github/workflows/_template-build-image.yml
  )
repos:
- repo: https://github.com/google/yapf
  rev: v0.43.0
  hooks:
  - id: yapf
    args: [--in-place, --verbose]
    additional_dependencies: [toml] # TODO: Remove when yapf is upgraded
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.11.12
  hooks:
  - id: ruff
    args: [--output-format, github, --fix]
- repo: https://github.com/codespell-project/codespell
  rev: v2.4.1
  hooks:
  - id: codespell
    additional_dependencies: ['tomli']
    args: ['--toml', 'pyproject.toml']
# - repo: https://github.com/PyCQA/isort
#   rev: 6.0.1
#   hooks:
#   - id: isort
- repo: https://github.com/jackdewinter/pymarkdown
  rev: v0.9.30
  hooks:
  - id: pymarkdown
    args: [fix]
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.7
  hooks:
  - id: actionlint
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.15.0
  hooks:
  - id: mypy
    args: [--python-version, '3.10', --follow-imports, "skip", "--disable-error-code", "union-attr", "--disable-error-code", "override" ]
    additional_dependencies: [types-aiofiles, types-cachetools, types-setuptools, types-PyYAML, types-requests]
- repo: local
  hooks:
  - id: check-filenames
    name: Check for spaces in filenames
    entry: bash
    args:
      - -c
      - |
        # Reads the filenames pre-commit passes in, so a PR-scoped run
        # (--from-ref/--to-ref) only judges files that PR touched. With
        # always_run + git ls-files this hook failed a PR for a space in an
        # inherited file the author never edited. The workflow_call path still
        # audits the whole tree via --all-files.
        status=0
        for name in "$@"; do
          case "$name" in
            fastvideo/tests/ssim/*) continue ;;
            fastvideo/tests/inference/lora/L40S_reference_videos/*) continue ;;
          esac
          case "$name" in
            *" "*)
              echo "Filenames should not contain spaces: $name"
              status=1
              ;;
          esac
        done
        exit "$status"
      - --
    language: system
    pass_filenames: true
  # Keep `suggestion` last
  - id: suggestion
    name: Suggestion
    entry: bash -c 'echo "To bypass pre-commit hooks, add --no-verify to git commit."'
    language: system
    verbose: true
    pass_filenames: false
  # Insert new entries above the `suggestion` entry
