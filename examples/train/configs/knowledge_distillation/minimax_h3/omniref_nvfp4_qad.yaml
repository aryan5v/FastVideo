# FastH3 OmniRef NVFP4 QAD (4 nodes x 4 GPUs). Output regression + step-0-normalized layer reconstruction,
# starting from the calibrated NVFP4 model (MSE-clipped static FFN scales, blocks 42-49 kept bf16) with FP4
# sparse attention (two-level P, K smoothing). See docs/training/omniref_nvfp4_qad.md. Replace the placeholder
# paths below; set amax_sha256 to the calibration file's sha256 to pin it.
models:
  student:
    _target_: fastvideo.train.models.minimax_h3.omniref_pdd.MiniMaxH3OmniRefPDDModel
    init_from: checkpoints/FastH3-OmniRef-v5-DMPDD8-w03-cfg2-step3500
    trainable: true
    enable_gradient_checkpointing_type: full
    qad:
      enabled: true
      linears:
        enabled: true
        amax_json: outputs/omniref_nvfp4_calib/sweep/amax-mse_bf16_top8.json
        attention: true
        gate: true
        ffn: true
        skip_blocks:
        - 42
        - 43
        - 44
        - 45
        - 46
        - 47
        - 48
        - 49
        amax_sha256: null
      fp4_attention:
        enabled: true
        two_level_p: true
        smooth_k: true
        first_block_max_floor: null
    data:
      manifests:
      - data/omniref-processed/encoded/full/MANIFEST.jsonl
      cases:
      - first_frame
      - first_last_frame
      - storyboard
      - continue_scene
      - continue_shot
      - full_scene_audio_image_reference
      per_group:
        480p: 400
        768p: 50
      seed: 20261007
      max_frames: 243
      eval_manifest: data/omniref-eval/manifest.json
      eval_resolutions:
      - 480p
      - 768p
      eval_per_group:
        480p: 2
        768p: 1
      eval_max_frames: 0
    trainable_patterns: transformer_blocks\.\d+\.(attn\.(to_q|to_k|to_v|to_out|to_gate_compress|norm_q|norm_k)|ff\.(fc_in|fc_out))\.
  teacher:
    _target_: fastvideo.train.models.minimax_h3.omniref_pdd.MiniMaxH3OmniRefPDDModel
    init_from: checkpoints/FastH3-OmniRef-v5-DMPDD8-w03-cfg2-step3500
    trainable: false
method:
  _target_: fastvideo.train.methods.knowledge_distillation.pdd_qad.OmniRefPDDQADMethod
  video_weight: 1.0
  audio_weight: 1.0
  rollout_fraction: 0.25
  rollout_start_step: 20
  rungs_per_row: 4
  eval_every: 15
  patience: 2
  fidelity_tolerance: 0.05
  require_bitwise_init: true
  save_best: true
  ptq_reference_json: null
  ptq_tolerance: 0.05
  select_metric: score
  eval_save_dir: outputs/omniref_nvfp4_qad/samples
  objective: output+recon
  recon_lambda: 1.0
  full_eval_every: 30
  recon_normalize: step0
  max_rollout_rows: 10
  noise_floor_eval: true
training:
  distributed:
    num_gpus: 16
    sp_size: 4
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 16
    pin_cpu_memory: false
  data:
    train_batch_size: 1
    seed: 1234
  optimizer:
    learning_rate: 5.0e-06
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0
    lr_scheduler: cosine_with_min_lr
    lr_warmup_steps: 10
    min_lr_ratio: 0.3
  loop:
    max_train_steps: 200
    gradient_accumulation_steps: 1
  checkpoint:
    output_dir: outputs/omniref_nvfp4_qad
    training_state_checkpointing_steps: 0
    checkpoints_total_limit: 1
    resume_from_checkpoint: ''
  tracker:
    trackers:
    - wandb
    project_name: fasth3-omniref-nvfp4
    run_name: omniref-nvfp4-qad
  model:
    enable_gradient_checkpointing_type: full
  dit_precision: fp32
  vsa_sparsity: 0.0
callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
pipeline: {}
