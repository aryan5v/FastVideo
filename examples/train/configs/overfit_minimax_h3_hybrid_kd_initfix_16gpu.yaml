# FastH3-native hybrid attention overfit with live far-branch initialization.
# Fresh-start validation run: never resume the known-dead v1 checkpoint.

models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3Model
    init_from: /mnt/lustre/vlm-aryan/fastvideo-h3-hybrid-training/runs/fasth3_hybrid_kd_v1_16gpu_overfit/compare/FastH3-Preview-v1
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: TORCH_SDPA
    hybrid_attention: true
    trainable_parameter_patterns: [linear_attention, to_out_linear, softmax_gate]
    sigma_grid_points: 5
  teacher:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3Model
    init_from: /mnt/lustre/vlm-aryan/fastvideo-h3-hybrid-training/runs/fasth3_hybrid_kd_v1_16gpu_overfit/compare/FastH3-Preview-v1
    trainable: false
    attention_backend: VIDEO_SPARSE_ATTN_H3
    hybrid_attention: false
    vsa_tile_size: 64

method:
  _target_: fastvideo.train.methods.knowledge_distillation.minimax_h3_velocity.MiniMaxH3VelocityKDMethod

training:
  distributed:
    num_gpus: 16
    sp_size: 8
    tp_size: 1
    hsdp_replicate_dim: 2
    hsdp_shard_dim: 8
    pin_cpu_memory: true

  data:
    data_path:
      /mnt/lustre/vlm-aryan/fastvideo-h3-hybrid-training/data/crush-smol_h3_t2va_single_sample_preprocessed: 2
    preprocessed_data_type: t2va
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 37
    num_height: 768
    num_width: 1344
    num_frames: 124

  optimizer:
    learning_rate: 5.0e-5
    betas: [0.9, 0.999]
    weight_decay: 0.0
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 400
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: /mnt/lustre/vlm-aryan/fastvideo-h3-hybrid-training/runs/fasth3_hybrid_kd_v1_initfix_16gpu_overfit/checkpoints
    training_state_checkpointing_steps: 20
    checkpoints_total_limit: 1
    predelete_old_checkpoints: true
    resume_from_checkpoint: ""

  tracker:
    trackers: [wandb]
    project_name: fastvideo_minimax_h3
    run_name: fasth3_native_hybrid_kd_v1_initfix_16gpu_overfit

  vsa:
    sparsity: 0.9
    cache_tile_buf: false

  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full

  dit_precision: bf16

callbacks:
  hybrid_grad_liveness:
    _target_: fastvideo.train.callbacks.minimax_h3_hybrid_liveness.MiniMaxH3HybridGradientLivenessCallback
    readout_step: 1
    internal_step: 2
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  hybrid_export:
    _target_: fastvideo.train.callbacks.minimax_h3_hybrid_export.MiniMaxH3HybridExportCallback
    output_dir: /mnt/lustre/vlm-aryan/fastvideo-h3-hybrid-training/runs/fasth3_hybrid_kd_v1_initfix_16gpu_overfit/exploded

pipeline: {}
