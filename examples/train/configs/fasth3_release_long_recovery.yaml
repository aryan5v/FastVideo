# Long folded-backbone recovery. The launcher binds the exact selected student
# and pruning seams. The production launcher uses three DP replicas x four
# accumulation rounds (global effective batch 12) over the audio-stratified
# 58k prompt corpus; the in-file topology remains a 16-GPU reference maximum.
# Keep high-step recovery on Base-teacher prefix states. The controlled 7045 /
# 7046 comparison showed that 25% student prefixes from a half-recovered 6972
# parent crushed audio brightness and voicing. Few-call inference-state
# exposure is handled later by DMD2/PDD, after the backbone clears quality
# gates, rather than teaching this recovery run to imitate its own errors.
models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3Model
    init_from: /path/bound/by/launcher
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: TORCH_SDPA
  teacher:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3Model
    init_from: /mnt/nfs/vlm-aryan/hf-cache/hub/models--MiniMaxAI--MiniMax-H3/snapshots/42ed227ee7df40d41602854ae760620d6eb651fe
    trainable: false
    disable_custom_init_weights: true
    attention_backend: TORCH_SDPA
method:
  _target_: fastvideo.train.methods.knowledge_distillation.minimax_h3_base_recovery.MiniMaxH3BaseRecoveryMethod
  denoising_weight: 0.0
  teacher_velocity_weight: 1.0
  video_velocity_weight: 1.0
  audio_velocity_weight: 4.0
  audio_seam_weight: 2.0
  feature_weight: 1.0
  teacher_grid_points: 50
  feature_local_block_indices: []
  modality_energy_floor: 0.001
  low_sigma_interval_fraction: 0.5
  low_sigma_interval_count: 12
  student_state_probability: 0.0
  modality_grad_probe_every: 0
  allow_prompt_only: true
training:
  distributed:
    num_gpus: 16
    sp_size: 4
    tp_size: 1
    hsdp_replicate_dim: 4
    hsdp_shard_dim: 4
    pin_cpu_memory: true
  data:
    data_path: /mnt/nfs/vlm-aryan/fasth3-14b-2step-qad-20260829/data/user-prompts-20260906/index-v3-audio-stratified
    preprocessed_data_type: t2va
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 20260910
    num_latent_t: 37
    num_height: 480
    num_width: 832
    num_frames: 124
  optimizer:
    learning_rate: 1.0e-05
    betas: [0.9, 0.999]
    weight_decay: 0.0
    lr_scheduler: cosine
    lr_warmup_steps: 100
  loop:
    max_train_steps: 4000
    gradient_accumulation_steps: 4
  checkpoint:
    output_dir: /path/bound/by/launcher
    training_state_checkpointing_steps: 50
    use_cpu_process_group: true
    checkpoints_total_limit: 3
    preserve_every_steps: 0
    preserve_steps: [100, 250, 500, 1000, 2000, 4000, 5000, 6000]
    resume_from_checkpoint: ''
  tracker:
    trackers: [wandb]
    project_name: fasth3-14b-2step-qad-sprint
    run_name: folded-release-long-recovery
  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full
  vsa:
    sparsity: 0.0
    tile_size: 64
    cache_tile_buf: false
  dit_precision: fp32
callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
pipeline: {}
