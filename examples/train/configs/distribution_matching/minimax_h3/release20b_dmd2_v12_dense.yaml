# Release-20B adaptation of the successful MiniMax-H3 V12 dense DMD2 recipe.
# The launcher replaces both __SELECTED_PARENT__ values with the checkpoint
# selected by the matched-seed checkpoint-300/350/400/450 quality gate.
models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: __SELECTED_PARENT__
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: TORCH_SDPA
  teacher:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: /mnt/nfs/vlm-aryan/hf-cache/hub/models--MiniMaxAI--MiniMax-H3/snapshots/42ed227ee7df40d41602854ae760620d6eb651fe
    trainable: false
    # The frozen teacher has no optimizer masters. FSDP already evaluates it
    # in BF16, so BF16 construction is numerically identical at forward time
    # and avoids retaining an unnecessary FP32 copy on every rank.
    construction_precision: bf16
    disable_custom_init_weights: true
    attention_backend: TORCH_SDPA
  critic:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    # V12's fake-score model starts from the full base H3 distribution.  A
    # folded student critic is cheaper, but was the largest recipe drift in
    # the rejected 2750-phase lineage.
    init_from: /mnt/nfs/vlm-aryan/hf-cache/hub/models--MiniMaxAI--MiniMax-H3/snapshots/42ed227ee7df40d41602854ae760620d6eb651fe
    trainable: true
    disable_custom_init_weights: true
    enable_gradient_checkpointing_type: full
    attention_backend: TORCH_SDPA

method:
  _target_: fastvideo.train.methods.distribution_matching.dmd2.DMD2Method
  rollout_mode: simulate
  rollout_carry: true
  rollout_carry_slots: 8
  rollout_sample_type: ode
  generator_update_interval: 5
  real_score_guidance_scale: 1.0
  dmd_denoising_steps: [999, 749, 500, 250]
  min_timestep_ratio: 0.001
  max_timestep_ratio: 0.999
  score_timestep_shift: 2.4
  score_timestep_warp_max: 0.999
  score_timestep_continuous: true
  fake_score_loss_space: x0
  modality_loss_weights:
    video: 1.0
    audio: 1.0
  cfg_uncond:
    text: zero
  fake_score_learning_rate: 2.0e-6
  fake_score_betas: [0.9, 0.999]
  fake_score_lr_scheduler: constant

training:
  distributed:
    num_gpus: 16
    sp_size: 4
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 16
    pin_cpu_memory: true
  data:
    # Reuse the durable prompt-only corpus from the successful V12 run.  The
    # previous custom index disappeared between resumes, leaving an empty
    # directory and killing job 8945.
    data_path:
      - /mnt/lustre/vlm-shared/h3_t2av_preprocessed/v10_mixed_native_v3/h3_t2av_video_nuva_50k_720_mixed_len/data
      - /mnt/lustre/vlm-shared/h3_t2av_preprocessed/v10_mixed_native_v3/h3_t2av_video_5s_768p/data
      - /mnt/lustre/vlm-shared/h3_t2av_preprocessed/v10_mixed_native_v3/h3_t2av_video_nuva_10k_720_mixed_len/data
      - /mnt/lustre/vlm-shared/h3_t2av_preprocessed/v10_mixed_native_v3/h3_t2av_video_nuva_10k_mixed_res_len/data
      - /mnt/lustre/vlm-shared/h3_t2av_preprocessed/v10_mixed_native_v3/h3_t2av_fastgen_vidprom_150k/data
    preprocessed_data_type: text_only
    native_shape_bucketing: false
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 37
    num_height: 480
    num_width: 832
    num_frames: 124
  optimizer:
    learning_rate: 2.0e-6
    betas: [0.9, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0
  loop:
    max_train_steps: 1000
    # The runner overrides this to eight on the original 32-GPU V12 topology,
    # preserving the recipe's global batch of 64.
    gradient_accumulation_steps: 16
  checkpoint:
    output_dir: __OUTPUT_DIR__
    resume_from_checkpoint: ""
    save_inference_checkpoint_on_validation: true
    inference_checkpoint_role: student
    inference_checkpoint_dtype: bfloat16
    training_state_checkpointing_steps: 100
    require_complete_training_checkpoint: true
    checkpointing_start_step: 100
    # Preserve intermediate peaks for the AV gate instead of assuming the
    # last phase is the best phase.
    # Smoke plus forty 100-phase gates through phase 4,000. Keep the complete
    # trajectory so a middle quality peak cannot be pruned before AV review.
    checkpoints_total_limit: 50
  tracker:
    trackers: [wandb]
    project_name: fasth3-14b-2step-qad-sprint
    run_name: release20b-dmd2-v12-dense
  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full
    enable_torch_compile: false
  dit_precision: fp32
  vsa:
    sparsity: 0.0
    tile_size: 64
    cache_tile_buf: false

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  validation:
    _target_: fastvideo.train.callbacks.validation.ValidationCallback
    pipeline_target: fastvideo.pipelines.basic.minimax_h3.minimax_h3_pipeline.MiniMaxH3Pipeline
    dataset_file: examples/train/configs/distribution_matching/minimax_h3/release20b_validation_five.json
    every_steps: 100
    run_at_start: true
    sampling_steps: [4]
    guidance_scale: 1.0
    use_record_dimensions: true
    max_record_num_frames: 124
    num_videos_per_prompt: 1
    use_validation_media_conditioning: false
    offload_training_state: true
    text_encoder_cpu_offload: true
    vae_cpu_offload: true

pipeline:
  dit_config:
    uniform_parameter_dtype: false
