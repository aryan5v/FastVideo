# FastH3 33B DMD overfit smoke — validates the dual-scheduler training stack
# end to end (prepare_batch -> rollout -> dmd/critic losses -> backward ->
# optimizer step) on one clip, a handful of steps. Not a real run.

models:
  student:
    _target_: fastvideo.train.models.h3.h3.H3Model
    init_from: MiniMaxAI/MiniMax-H3
    trainable: true
  teacher:
    _target_: fastvideo.train.models.h3.h3.H3Model
    init_from: MiniMaxAI/MiniMax-H3
    trainable: false
    disable_custom_init_weights: true
  critic:
    _target_: fastvideo.train.models.h3.h3.H3Model
    init_from: MiniMaxAI/MiniMax-H3
    trainable: true
    disable_custom_init_weights: true

method:
  _target_: fastvideo.train.methods.distribution_matching.h3_dmd2.H3DMD2Method
  rollout_mode: simulate
  generator_update_interval: 1
  real_score_guidance_scale: 1.0
  dmd_denoising_steps: [0.04, 0.143, 1.0]
  cfg_uncond:
    text: keep
  fake_score_learning_rate: 8.0e-6
  fake_score_betas: [0.0, 0.999]
  fake_score_lr_scheduler: constant

training:
  distributed:
    num_gpus: 4
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 4

  data:
    data_path: /mnt/nfs/vlm-aryan/fasth3-33b-20260806/data/h3_corpus
    preprocessed_data_type: t2v
    train_batch_size: 1
    dataloader_num_workers: 0
    seed: 1000

  optimizer:
    learning_rate: 1.0e-6
    betas: [0.0, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 30
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: /mnt/nfs/vlm-aryan/fasth3-33b-20260806/outputs/h3_33b_dmd_smoke
    training_state_checkpointing_steps: 100000
    checkpoints_total_limit: 1

  tracker:
    project_name: fasth3
    run_name: h3_33b_dmd_overfit_smoke

  model:
    enable_gradient_checkpointing_type: full

callbacks:
  grad_clip:
    max_grad_norm: 1.0

pipeline:
  flow_shift: 8
