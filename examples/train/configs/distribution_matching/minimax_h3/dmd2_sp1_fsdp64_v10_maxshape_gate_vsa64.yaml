# V10 capacity gate: the exact production model, precision, compile, and
# 64-rank FSDP topology on only the largest native-shape bucket. This is a
# two-step critic-then-student probe, not a training lineage.

models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: /mnt/lustre/vlm-k1kong/models/MiniMax-H3
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: VIDEO_SPARSE_ATTN_H3
  teacher:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: /mnt/lustre/vlm-k1kong/models/MiniMax-H3
    trainable: false
    disable_custom_init_weights: true
    attention_backend: FLASH_ATTN
  critic:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3DMDModel
    init_from: /mnt/lustre/vlm-k1kong/models/MiniMax-H3
    trainable: true
    disable_custom_init_weights: true
    enable_gradient_checkpointing_type: full
    attention_backend: FLASH_ATTN

method:
  _target_: fastvideo.train.methods.distribution_matching.dmd2.DMD2Method
  rollout_mode: data_latent
  # Step 1 updates the critic and step 2 updates the student, so both
  # backward peaks are exercised while both Adam states remain resident.
  generator_update_interval: 2
  real_score_guidance_scale: 1.0
  dmd_denoising_steps: [999, 749, 500, 250]
  min_timestep_ratio: 0.001
  max_timestep_ratio: 0.999
  score_timestep_shift: 2.4
  fake_score_loss_space: x0
  cfg_uncond:
    text: zero

  fake_score_learning_rate: 2.0e-6
  fake_score_betas: [0.9, 0.999]
  fake_score_lr_scheduler: constant

training:
  distributed:
    num_gpus: 64
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 64

  data:
    # The gate runbook stages hardlinks to all finalized 1760x768-362f v2
    # parquets under this isolated root.
    data_path: /mnt/lustre/vlm-wlsaidhi/fastvideo/vsa_gate/v10_maxshape_64g/data
    preprocessed_data_type: t2va
    native_shape_bucketing: true
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 107
    num_height: 768
    num_width: 1760
    num_frames: 362

  optimizer:
    learning_rate: 2.0e-6
    betas: [0.9, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 2
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: /mnt/lustre/vlm-wlsaidhi/fastvideo/vsa_gate/v10_maxshape_64g/output
    # A non-empty value deliberately calls seed_optimizer_state_for_resume()
    # before `latest` resolves to no checkpoint in this fresh directory. That
    # materializes both the student and critic Adam moments before step 1.
    resume_from_checkpoint: latest
    save_inference_checkpoint_on_validation: false
    training_state_checkpointing_steps: 0
    checkpointing_start_step: 0
    checkpoints_total_limit: 0

  tracker:
    project_name: h3-dmd2-vsa-capacity-gates
    run_name: dmd2_sp1_fsdp64_v10_maxshape_gate_vsa64

  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full
    # Exact production policy: compile the dense teacher/critic regions and
    # leave the VSA-H3 student eager under the loader's safety gate.
    enable_torch_compile: true
    torch_compile_kwargs: {}

  dit_precision: fp32
  vsa:
    sparsity: 0.9
    tile_size: 64

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0

pipeline:
  dit_config:
    uniform_parameter_dtype: false
