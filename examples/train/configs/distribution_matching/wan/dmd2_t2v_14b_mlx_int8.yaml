# Mac-targeted QAD distillation at 14B: Wan 2.1 T2V 14B -> 3-step INT8 student.
#
# Direct scale-up of dmd2_t2v_mlx_int8_v2.yaml, the recipe that produced
# accepted quality at 1.3B (wandb: distillation_wan/wan2.1_dmd2_3steps_mlx_int8_v2).
# Everything that made v2 work is preserved verbatim:
#
# - Student and critic initialize from the already-3-step-distilled FastWan
#   checkpoint, so training is "adapt a good 3-step model to the INT8 grid"
#   rather than learning distillation from scratch through a quantizer. The
#   teacher stays the base 50-step Wan2.1. (v1 did the latter and failed.)
# - gradient_accumulation_steps 4, keeping effective batch at 16.
# - The world-size-portable EMA checkpoint state from ema.py.
# - The committed, bitwise-parity-tested affine INT8 fake-quantizer
#   (fastvideo/layers/quantization/mlx_affine_qat.py,
#    fastvideo/tests/mlx/test_mlx_affine_qat_parity.py). This is the difference
#   from the failed 14B mxfp4 run (wandb: wan2.1_14b_dmd2_3steps_mlx_mxfp4),
#   which used the worst-reconstructing format on the M5 survey AND an
#   uncommitted quantizer with no parity test.
#
# Changes vs v2, all mechanical:
# - 14B student/critic/teacher checkpoints.
# - 8-GPU 2D HSDP mesh (2 replicate x 4 shard) on 2 nodes. This matches the
#   PROVEN mxfp4 14B run's per-GPU state (~119 GB on 4 shards) while limiting
#   the multi-node NCCL surface to 2 nodes (16/32-GPU attempts kept landing
#   on bad/draining nodes; single-node 4-GPU is the fallback).
#   v2's 4-GPU pure-FSDP layout does not hold a 14B student plus frozen
#   teacher and critic.
# - Checkpoint cadence relaxed from every 20 steps to every 100: at 14B the
#   save cost is no longer negligible against the step time.
#
# Measured cost of the 14B mxfp4 run: 26 GPU-days for 4000 iterations
# (141 s/iter on 4x B200). On 16 GPUs expect roughly 35-40 hours.
#
# hsdp_shard_dim must divide num_gpus and hold one full model shard set. If
# running on a different count, keep shard_dim >= 8 and put the remainder in
# hsdp_replicate_dim.

models:
  student:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: FastVideo/FastWan2.1-T2V-14B-Diffusers
    trainable: true
  teacher:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: Wan-AI/Wan2.1-T2V-14B-Diffusers
    trainable: false
    disable_custom_init_weights: true
  critic:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: FastVideo/FastWan2.1-T2V-14B-Diffusers
    trainable: true
    disable_custom_init_weights: true

method:
  _target_: fastvideo.train.methods.distribution_matching.dmd2.DMD2Method
  rollout_mode: simulate
  generator_update_interval: 5
  real_score_guidance_scale: 4.5
  dmd_denoising_steps: [1000, 757, 522]

  # Critic optimizer (required — no fallback to training.optimizer)
  fake_score_learning_rate: 8.0e-6
  fake_score_betas: [0.0, 0.999]
  fake_score_lr_scheduler: constant

training:
  distributed:
    num_gpus: 8
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 2
    hsdp_shard_dim: 4

  data:
    data_path: data/Wan-Syn_77x448x832_600k
    dataloader_num_workers: 4
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 1000
    num_latent_t: 20
    num_height: 448
    num_width: 832
    num_frames: 77

  optimizer:
    learning_rate: 2.0e-6
    betas: [0.0, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 4000
    gradient_accumulation_steps: 4

  checkpoint:
    output_dir: outputs/wan2.1_14b_dmd2_3steps_mlx_int8
    training_state_checkpointing_steps: 100
    checkpoints_total_limit: 3

  tracker:
    project_name: distillation_wan
    run_name: wan2.1_14b_dmd2_3steps_mlx_int8

  model:
    enable_gradient_checkpointing_type: full

callbacks:
  mlx_qat:
    mode: affine
    group_size: 64
    bits: 8
    simulate_dtype: fp16
  grad_clip:
    max_grad_norm: 1.0
  validation:
    pipeline_target: fastvideo.pipelines.basic.wan.wan_dmd_pipeline.WanDMDPipeline
    dataset_file: examples/training/finetune/Wan2.1-VSA/Wan-Syn-Data/validation_4.json
    every_steps: 100
    validate_at_step_zero: false
    sampling_steps: [3]
    sampling_timesteps: [1000, 757, 522]
    guidance_scale: 6.0
  ema:
    _target_: fastvideo.train.callbacks.ema.EMACallback
    decay: 0.98
    start_iter: 0

pipeline:
  flow_shift: 8
