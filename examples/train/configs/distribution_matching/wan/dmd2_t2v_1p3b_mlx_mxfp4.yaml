# Mac-targeted QAD at 1.3B on the MXFP4 grid, for M5 and newer.
#
# This is dmd2_t2v_mlx_int8_v2.yaml with EXACTLY ONE CHANGE: the mlx_qat
# callback targets mxfp4 instead of affine int8. Everything else — student and
# critic initialized from the already-distilled FastWan, effective batch 16,
# EMA, schedule, optimizer, validation — is byte-identical, so the int8 run is
# a controlled baseline and any quality delta is attributable to the grid.
#
# The previous mxfp4 attempts did not have that property: they ran an
# uncommitted quantizer with no parity test, and produced a student gradient
# norm 0.47x the int8 run's at *lower* loss, which reads as a student barely
# being optimized rather than one converged somewhere worse.
#
# PREREQUISITES — do not launch without both:
#
#   1. fastvideo/tests/mlx/test_mlx_mx_qat_parity.py passes on the Mac. It pins
#      fastvideo/layers/quantization/mlx_mx_qat.py against
#      mx.quantize(..., mode="mxfp4"). Without it the student trains against a
#      grid the runtime may not use, which is indistinguishable from the format
#      not working.
#   2. The mlx_qat callback accepts `mode` and dispatches to fake_quantize_mlx_mx
#      for MX modes. See docs/design/apple_silicon_launch_checklist.md.
#
# Why 1.3B and not 14B: 5.3 GPU-days against 26, on the model whose MLX runtime
# is best proven. Prove the grid here, then scale the same config to 14B.
#
# Note MX blocks are fixed at 32 by the OCP spec, not the affine default of 64,
# so `group_size` is absent here by design.

models:
  student:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: FastVideo/FastWan2.1-T2V-1.3B-Diffusers
    trainable: true
  teacher:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    trainable: false
    disable_custom_init_weights: true
  critic:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: FastVideo/FastWan2.1-T2V-1.3B-Diffusers
    trainable: true
    disable_custom_init_weights: true

method:
  _target_: fastvideo.train.methods.distribution_matching.dmd2.DMD2Method
  rollout_mode: simulate
  generator_update_interval: 5
  real_score_guidance_scale: 4.5
  dmd_denoising_steps: [1000, 757, 522]

  # Critic optimizer (required — no fallback to training.optimizer)
  fake_score_learning_rate: 8.0e-6
  fake_score_betas: [0.0, 0.999]
  fake_score_lr_scheduler: constant

training:
  distributed:
    num_gpus: 8
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 2
    hsdp_shard_dim: 4

  data:
    data_path: data/Wan-Syn_77x448x832_600k
    dataloader_num_workers: 4
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 1000
    num_latent_t: 20
    num_height: 448
    num_width: 832
    num_frames: 77

  optimizer:
    learning_rate: 2.0e-6
    betas: [0.0, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 4000
    gradient_accumulation_steps: 4

  checkpoint:
    output_dir: outputs/wan2.1_dmd2_3steps_mlx_mxfp4_v2
    training_state_checkpointing_steps: 20
    checkpoints_total_limit: 3

  tracker:
    project_name: distillation_wan
    run_name: wan2.1_dmd2_3steps_mlx_mxfp4_v2

  model:
    enable_gradient_checkpointing_type: full

callbacks:
  mlx_qat:
    mode: mxfp4
    simulate_dtype: fp16
  grad_clip:
    max_grad_norm: 1.0
  validation:
    pipeline_target: fastvideo.pipelines.basic.wan.wan_dmd_pipeline.WanDMDPipeline
    dataset_file: examples/training/finetune/Wan2.1-VSA/Wan-Syn-Data/validation_4.json
    every_steps: 50
    sampling_steps: [3]
    sampling_timesteps: [1000, 757, 522]
    guidance_scale: 6.0
  ema:
    _target_: fastvideo.train.callbacks.ema.EMACallback
    decay: 0.98
    start_iter: 0

pipeline:
  flow_shift: 8
