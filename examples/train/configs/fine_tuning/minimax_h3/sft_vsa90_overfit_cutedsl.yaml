# MiniMax-H3 single-sample SFT overfit with VSA-H3 at sparsity 0.9 — rerun
# on the FA4 CuTe DSL block-sparse backend (FASTVIDEO_VSA_CUTEDSL=1 via the
# fa4_overlay). Same seed/recipe as the Triton rerun
# (sft_vsa90_overfit_fixedkernel, run gl5mrw23) for an apples-to-apples
# gradient/loss comparison — the pre-flip gate for CuTe fwd+bwd training.

models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3Model
    init_from: /mnt/lustre/vlm-k1kong/models/MiniMax-H3
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: VIDEO_SPARSE_ATTN_H3

method:
  _target_: fastvideo.train.methods.fine_tuning.finetune.FineTuneMethod

training:
  distributed:
    num_gpus: 4
    sp_size: 4
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 4

  data:
    data_path: /mnt/lustre/vlm-wlsaidhi/fastvideo/data/h3_overfit_t2va_0000007
    preprocessed_data_type: t2va
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 37
    num_height: 768
    num_width: 1344
    num_frames: 124

  # Student VSA sparsity (0.9 = top-10% of tiles attended).
  vsa:
    sparsity: 0.9

  optimizer:
    learning_rate: 5.0e-5
    betas: [0.9, 0.999]
    weight_decay: 0.0
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 300
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: /mnt/lustre/vlm-wlsaidhi/fastvideo/outputs/sft_vsa90_overfit_cutedsl
    # 0 disables training-state checkpointing (no resume; avoids large DCP
    # saves on the shared volume).
    training_state_checkpointing_steps: 0
    checkpoints_total_limit: 3

  tracker:
    project_name: h3-dmd2-vsa
    run_name: sft_vsa90_overfit_cutedsl

  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full

  # fp32 masters (hard-checked); gradient norms are unaffected vs the bf16 baseline.
  dit_precision: fp32

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0

pipeline:
  dit_config:
    uniform_parameter_dtype: true
