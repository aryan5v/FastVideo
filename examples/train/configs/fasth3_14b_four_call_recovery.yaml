# Short Base-H3 anchoring on states produced by the exact four-call deployment
# trajectory. The launcher binds the rank-16 export of job 7102.
models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3Model
    init_from: /path/bound/by/launcher
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: TORCH_SDPA
  teacher:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3Model
    init_from: /mnt/nfs/vlm-aryan/hf-cache/hub/models--MiniMaxAI--MiniMax-H3/snapshots/42ed227ee7df40d41602854ae760620d6eb651fe
    trainable: false
    disable_custom_init_weights: true
    attention_backend: TORCH_SDPA
method:
  _target_: fastvideo.train.methods.knowledge_distillation.minimax_h3_recovery.MiniMaxH3FourCallRecoveryMethod
  denoising_weight: 0.0
  feature_weight: 1.0
  trajectory_weight: 1.0
  video_trajectory_weight: 1.0
  audio_trajectory_weight: 4.0
  teacher_substeps_per_interval: 4
  deployment_grid_points: 5
  feature_local_block_indices: []
  modality_energy_floor: 0.001
  student_state_probability: 1.0
  video_interval_weights: [1.0, 1.0, 1.0, 1.0]
  audio_interval_weights: [1.0, 1.0, 1.0, 1.0]
  require_fp32_master: true
training:
  distributed:
    num_gpus: 4
    sp_size: 4
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 4
    pin_cpu_memory: true
  data:
    data_path: /mnt/nfs/vlm-aryan/fasth3-14b-2step-qad-20260829/data/user-prompts-20260906/index-v3-audio-stratified
    preprocessed_data_type: t2va
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 20260910
    num_latent_t: 37
    num_height: 480
    num_width: 832
    num_frames: 124
  optimizer:
    learning_rate: 1.0e-06
    betas: [0.9, 0.999]
    weight_decay: 0.0
    lr_scheduler: cosine
    lr_warmup_steps: 25
  loop:
    max_train_steps: 1000
    gradient_accumulation_steps: 1
  checkpoint:
    output_dir: /path/bound/by/launcher
    training_state_checkpointing_steps: 50
    use_cpu_process_group: true
    checkpoints_total_limit: 3
    preserve_every_steps: 0
    preserve_steps: [100, 250, 500, 1000]
    resume_from_checkpoint: ''
  tracker:
    trackers: [wandb]
    project_name: fasth3-14b-2step-qad-sprint
    run_name: 14b-four-call-aware-recovery
  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full
  vsa:
    sparsity: 0.0
    tile_size: 64
    cache_tile_buf: false
  dit_precision: fp32
callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
pipeline: {}
