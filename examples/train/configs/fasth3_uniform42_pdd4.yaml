# PDD grid32 / stride4 training, fused width8 inference. H3 V23 adaptation.
models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3Model
    init_from: /mnt/nfs/vlm-aryan/fasth3-14b-2step-qad-20260829/checkpoints/base42-uniform-v1
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: TORCH_SDPA
  teacher:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3Model
    init_from: /mnt/nfs/vlm-aryan/hf-cache/hub/models--MiniMaxAI--MiniMax-H3/snapshots/42ed227ee7df40d41602854ae760620d6eb651fe
    trainable: false
    disable_custom_init_weights: true
    attention_backend: TORCH_SDPA
method:
  _target_: fastvideo.train.methods.trajectory_matching.minimax_h3_pdd.MiniMaxH3PDDMethod
  feature_local_block_indices:
  - 1
  feature_weight: 0.0
  denoising_weight: 0.0
training:
  distributed:
    num_gpus: 4
    sp_size: 4
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 4
    pin_cpu_memory: true
  data:
    data_path: /mnt/nfs/vlm-aryan/fasth3-14b-2step-qad-20260829/data/user-prompts-20260906/index-v2
    preprocessed_data_type: t2va
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 37
    num_height: 480
    num_width: 832
    num_frames: 124
  optimizer:
    learning_rate: 1.0e-05
    betas:
    - 0.9
    - 0.99
    weight_decay: 0.0
    lr_scheduler: constant
    lr_warmup_steps: 0
  loop:
    max_train_steps: 500
    gradient_accumulation_steps: 1
  checkpoint:
    output_dir: /mnt/nfs/vlm-aryan/fasth3-14b-2step-qad-20260829/runs/base42-preflight
    training_state_checkpointing_steps: 50
    use_cpu_process_group: true
    checkpoints_total_limit: 8
    preserve_every_steps: 50
    preserve_steps:
    - 8
    - 50
    - 100
    - 200
    - 300
    - 400
    - 500
    resume_from_checkpoint: ''
  tracker:
    trackers:
    - wandb
    project_name: fasth3-14b-2step-qad-sprint
    run_name: uniform42-pdd4-prompts58k
  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full
  vsa:
    sparsity: 0.0
    tile_size: 64
    cache_tile_buf: false
  dit_precision: fp32
callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
pipeline: {}
