# Detail-band recovery, 34-block release-candidate track (audit 2026-09-08):
# 300 updates from the job-6972 export (activation-34 step-0 + 200 prompt-58k)
# with (a) low-sigma-biased interval sampling so
# the detail-forming steps of the shift-12/shift-3 grid are actually trained,
# (b) audio up-weighted to match its true gradient share, (c) the real paired
# denoising branch kept on as the ground-truth anchor. Arm B overrides
# method.student_state_probability to 0.25 from the launcher.
models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3Model
    init_from: /mnt/nfs/vlm-aryan/fasth3-14b-2step-qad-20260829/runs/activation34-prompt58k-recovery/job-6972/export-200
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: TORCH_SDPA
  teacher:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3Model
    init_from: /mnt/nfs/vlm-aryan/hf-cache/hub/models--MiniMaxAI--MiniMax-H3/snapshots/42ed227ee7df40d41602854ae760620d6eb651fe
    trainable: false
    disable_custom_init_weights: true
    attention_backend: TORCH_SDPA
method:
  _target_: fastvideo.train.methods.knowledge_distillation.minimax_h3_base_recovery.MiniMaxH3BaseRecoveryMethod
  denoising_weight: 1.0
  teacher_velocity_weight: 1.0
  video_velocity_weight: 1.0
  audio_velocity_weight: 4.0
  audio_seam_weight: 2.0
  feature_weight: 1.0
  teacher_grid_points: 50
  feature_local_block_indices:
  - 4
  - 5
  - 6
  - 7
  - 8
  - 9
  - 10
  - 15
  modality_energy_floor: 0.001
  low_sigma_interval_fraction: 0.5
  low_sigma_interval_count: 12
  student_state_probability: 0.0
  modality_grad_probe_every: 0
  allow_prompt_only: false
training:
  distributed:
    num_gpus: 4
    sp_size: 4
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 4
    pin_cpu_memory: true
  data:
    data_path: /mnt/nfs/vlm-aryan/fasth3-14b-2step-qad-20260829/data/day1-mask-split/train
    preprocessed_data_type: t2va
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 20260829
    num_latent_t: 37
    num_height: 480
    num_width: 832
    num_frames: 124
  optimizer:
    learning_rate: 3.0e-05
    betas:
    - 0.9
    - 0.999
    weight_decay: 0.0
    lr_scheduler: constant
    lr_warmup_steps: 0
  loop:
    max_train_steps: 300
    gradient_accumulation_steps: 1
  checkpoint:
    output_dir: /mnt/nfs/vlm-aryan/fasth3-14b-2step-qad-20260829/runs/activation34-detail-band/job-placeholder
    training_state_checkpointing_steps: 150
    use_cpu_process_group: true
    checkpoints_total_limit: 3
    preserve_every_steps: 150
    preserve_steps:
    - 300
    resume_from_checkpoint: ''
  tracker:
    trackers:
    - wandb
    project_name: fasth3-14b-2step-qad-sprint
    run_name: activation34-detail-band
  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full
  vsa:
    sparsity: 0.0
    tile_size: 64
    cache_tile_buf: false
  dit_precision: fp32
callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
pipeline: {}
