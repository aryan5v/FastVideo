# OpenAI-compatible server for Cosmos Predict2.5 2B text-to-video.
#   fastvideo serve --config examples/serving/openai_cosmos25_t2v.yaml
generator:
  model_path: KyleShao/Cosmos-Predict2.5-2B-Diffusers
  engine:
    num_gpus: 1
    use_fsdp_inference: false
    parallelism:
      tp_size: 1
      sp_size: 1
    offload:
      dit: false
      vae: false
      text_encoder: true
      pin_cpu_memory: true
  pipeline:
    workload_type: t2v

server:
  host: 0.0.0.0
  port: 8000
  output_dir: outputs/openai_cosmos25_t2v
  served_model_name: cosmos25-t2v

default_request:
  negative_prompt: >-
    The video captures a series of frames showing ugly scenes, static with no
    motion, motion blur, over-saturation, shaky footage, low resolution, grainy
    texture, pixelated images, poorly lit areas, underexposed and overexposed
    scenes, poor color balance, washed out colors, choppy sequences, jerky
    movements, low frame rate, artifacting, color banding, unnatural transitions,
    outdated special effects, fake elements, unconvincing visuals, poorly edited
    content, jump cuts, visual noise, and flickering. Overall, the video is of
    poor quality.
  sampling:
    seed: 0
    num_frames: 77
    height: 704
    width: 1280
    fps: 24
    num_inference_steps: 35
    guidance_scale: 7.0
  output:
    return_frames: false
